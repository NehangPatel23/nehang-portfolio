<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 — Nehang Patel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Syne:wght@300;500&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#07070A;--text:#F0EDE8;--muted:#6E6880;--gold:#A78BF5;--border:rgba(167,139,245,.14)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;font-weight:300;padding:24px;text-align:center}
  h1{font-family:'Cormorant Garamond',serif;font-size:clamp(4rem,12vw,7rem);font-weight:400;color:var(--gold);line-height:1;margin-bottom:12px}
  p{color:var(--muted);margin-bottom:28px;max-width:420px;line-height:1.6}
  a{display:inline-block;padding:13px 32px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;background:var(--gold);color:#07070A;transition:opacity .3s}
  a:hover{opacity:.88}
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page wandered off the pathfinding grid. The route you're looking for doesn't exist.</p>
    <a href="/">Back to portfolio</a>
  </div>
</body>
</html>
